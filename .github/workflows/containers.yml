name: Container images

# Builds the four images in docs/containers.md and pushes them to GHCR.
# Started by hand only, with the tag to publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (params.container_tag)"
        required: true
        default: "0.1.0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: merxen
            dockerfile: containers/Dockerfile
          - image: merxen-alignment
            dockerfile: containers/Dockerfile.alignment
          - image: merxen-mender
            dockerfile: containers/Dockerfile.mender
          - image: merxen-clustering-gpu
            dockerfile: containers/Dockerfile.clustering-gpu
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.tag }}
